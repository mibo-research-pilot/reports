name: Weekly MIBO record

# Runs the weekly MIBO observation automatically and commits the result.
#
#   1. collect_observations.py  — sends the standard query set to each system's API and
#                                 records the verbatim responses + run metadata.
#   2. scaffold_weekly_record.py — builds the analysis workspace (report + coding files)
#                                 on top of the collected data.
#   3. commit + push            — updates Git with the week's record.
#
# Schedule: Tuesday 20:00 Asia/Tokyo == Tuesday 11:00 UTC.
# GitHub Actions cron runs in UTC, so JST 20:00 is expressed as 11:00 UTC.
# (Scheduled runs can be delayed by a few minutes to ~an hour under GitHub load.)

on:
  schedule:
    - cron: "0 11 * * 2"
  workflow_dispatch:
    inputs:
      date:
        description: "Observation date (YYYY-MM-DD). Leave blank for today's Asia/Tokyo date."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-record
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      OBS_DATE: ${{ github.event.inputs.date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect observations via provider APIs
        run: |
          if [ -n "$OBS_DATE" ]; then
            python3 scripts/collect_observations.py --date "$OBS_DATE"
          else
            python3 scripts/collect_observations.py
          fi

      - name: Build analysis workspace
        run: |
          if [ -n "$OBS_DATE" ]; then
            python3 scripts/scaffold_weekly_record.py --date "$OBS_DATE"
          else
            python3 scripts/scaffold_weekly_record.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE_JST="$(TZ=Asia/Tokyo date +%F)"
          git add -A
          git commit -m "Weekly MIBO record for ${DATE_JST} (automated API collection)"
          git push
