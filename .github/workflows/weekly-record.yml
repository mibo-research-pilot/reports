name: Weekly MIBO record

# Runs the weekly MIBO observation automatically and commits the result.
#
#   1. collect_observations.py  — sends the standard query set to each system's API and
#                                 records the verbatim responses + run metadata.
#   2. scaffold_weekly_record.py — builds the analysis workspace (report + coding files)
#                                 on top of the collected data.
#   3. code_observations.py      — LLM-drafts the entity coding for the collected responses.
#   4. commit + push            — updates Git with the week's record.
#
# Schedule: Tuesday 20:07 Asia/Tokyo == Tuesday 11:07 UTC.
# GitHub Actions cron runs in UTC, so JST 20:07 is expressed as 11:07 UTC.
# The :07 offset avoids the top-of-the-hour rush: GitHub delays or drops scheduled
# runs that all fire at :00 under load, so an off-peak minute improves reliability.
# (Scheduled runs can still be delayed by a few minutes to ~an hour under GitHub load.)

on:
  schedule:
    - cron: "7 11 * * 2"
  workflow_dispatch:
    inputs:
      date:
        description: "Observation date (YYYY-MM-DD). Leave blank for today's Asia/Tokyo date."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-record
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      OBS_DATE: ${{ github.event.inputs.date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect observations via provider APIs
        run: |
          if [ -n "$OBS_DATE" ]; then
            python3 scripts/collect_observations.py --date "$OBS_DATE"
          else
            python3 scripts/collect_observations.py
          fi

      - name: Build analysis workspace
        run: |
          if [ -n "$OBS_DATE" ]; then
            python3 scripts/scaffold_weekly_record.py --date "$OBS_DATE"
          else
            python3 scripts/scaffold_weekly_record.py
          fi

      - name: Draft entity coding
        run: |
          if [ -n "$OBS_DATE" ]; then
            python3 scripts/code_observations.py --date "$OBS_DATE"
          else
            python3 scripts/code_observations.py
          fi

      - name: Render observation report
        run: |
          if [ -n "$OBS_DATE" ]; then
            python3 scripts/render_observation.py --date "$OBS_DATE"
          else
            python3 scripts/render_observation.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --porcelain reports untracked (new) files too; git diff alone would miss them
          # and the week's record is entirely new files.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          # Use the observation date (OBS_DATE when dispatched with one, else today in JST)
          # so the commit message matches the record's observation_date.
          OBS_DATE_MSG="${OBS_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          git add -A
          git commit -m "Weekly MIBO record for ${OBS_DATE_MSG} (automated API collection)"
          git push

      - name: Notify Slack
        if: always()  # notify on both success and failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi
          OBS_DATE_MSG="${OBS_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          python3 - "$SLACK_WEBHOOK_URL" "$OBS_DATE_MSG" "$JOB_STATUS" "$RUN_URL" <<'PY'
          import json, sys, pathlib, urllib.request
          url, date, status, run_url = sys.argv[1:5]

          summary = "no run_metadata.json (collection may not have produced a record)"
          meta_path = pathlib.Path(date) / "run_metadata.json"
          if meta_path.exists():
              m = json.loads(meta_path.read_text(encoding="utf-8"))
              inc = m.get("included_observation_count", "?")
              exp = m.get("expected_observation_count", "?")
              day = m.get("session", "")
              per = ", ".join(f"{s['system']} {s.get('ok_count','?')}/{s.get('total_queries','?')}"
                              for s in m.get("systems", []))
              summary = f"{day} — {inc}/{exp} observations ({per})"

          icon = "✅" if status == "success" else "❌"
          verb = "committed" if status == "success" else f"run {status}"
          text = f"{icon} MIBO weekly record — {date}: {summary}. {verb}. {run_url}"

          data = json.dumps({"text": text}).encode()
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("Slack notified:", r.status)
          except Exception as e:
              print("Slack notification failed:", e)
          PY
